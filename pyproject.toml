[project]
name = "karb"
version = "0.1.0"
description = "Structural arbitrage scanner for Kalshi event contracts: fee-aware, depth-sized, exactly verified"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "numpy>=2.1.0",
    "scipy>=1.14.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "duckdb>=1.5.0",
    "cryptography>=44.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.122.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "scipy-stubs>=1.14.0",
]

[project.scripts]
karb = "karb.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Live tests hit the public Kalshi API; they are opt-in (`pytest -m live`).
addopts = "-m 'not live'"
markers = ["live: hits the public Kalshi API (deselected by default; run with -m live)"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["karb"]
mypy_path = "src"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# The money path and the structural reasoning carry the strictest guarantees: no Any escapes.
[[tool.mypy.overrides]]
module = ["karb.core.*", "karb.market.*", "karb.structure.*"]
disallow_any_explicit = true
